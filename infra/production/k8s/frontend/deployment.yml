apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakeside-frontend
  labels:
    app: lakeside-frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lakeside-frontend
  template:
    metadata:
      labels:
        app: lakeside-frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: rithik933/lakeside-frontend:v10
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: VITE_API_URL
          value: "https://lakeside-api.rithik.xyz"
        - name: VITE_WS_URL
          value: "wss://ws-lakeside.rithik.xyz/ws"
        - name: VITE_UPLOAD_URL
          value: "https://lakeside-upload.rithik.xyz"
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp
        - name: nginx-log
          mountPath: /var/log/nginx
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
      - name: nginx-log
        emptyDir: {}
      securityContext:
        fsGroup: 101
      restartPolicy: Always



