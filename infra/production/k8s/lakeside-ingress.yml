apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unified-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://lakeside.rithik.xyz,https://lakeside-api.rithik.xyz,https://ws-lakeside.rithik.xyz,https://lakeside-upload.rithik.xyz,https://superchess.rithik.xyz,https://superchess-api.rithik.xyz,https://superchess-ws.rithik.xyz"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/websocket-services: "signaling-server,game-arena"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  labels:
    app: unified-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - lakeside.rithik.xyz
        - lakeside-api.rithik.xyz
        - ws-lakeside.rithik.xyz
        - lakeside-upload.rithik.xyz
        - superchess.rithik.xyz
        - superchess-api.rithik.xyz
        - superchess-ws.rithik.xyz
      secretName: unified-tls
  rules:
    - host: lakeside.rithik.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lakeside-frontend
                port:
                  number: 80
    - host: lakeside-api.rithik.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: session-service
                port:
                  number: 80
    - host: ws-lakeside.rithik.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signaling-server
                port:
                  number: 80
    - host: lakeside-upload.rithik.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: upload-service
                port:
                  number: 80
    - host: superchess.rithik.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superchess-frontend
                port:
                  number: 80
    - host: superchess-api.rithik.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
    - host: superchess-ws.rithik.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: game-arena
                port:
                  number: 80