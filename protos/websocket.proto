syntax = "proto3";

package lakeside.websocket;

option go_package = "github.com/lakeside/backend/protos/gen/websocket;websocket";

// WebSocketMessage - main message structure for WebSocket communication
// Used for WebRTC signaling between clients
message WebSocketMessage {
  string type = 1;
  string podcast_id = 2;
  string from = 3;
  string to = 4;
  int64 timestamp = 5;
  
  // Payload - use oneof for type safety
  oneof payload {
    OfferPayload offer = 10;
    AnswerPayload answer = 11;
    ICECandidatePayload ice_candidate = 12;
    RecordingControlPayload recording_control = 13;
    UserJoinedPayload user_joined = 14;
    UserLeftPayload user_left = 15;
    ErrorPayload error = 16;
  }
}

// WebRTC SDP Offer
message OfferPayload {
  string sdp = 1;
  string type = 2; // "offer"
}

// WebRTC SDP Answer
message AnswerPayload {
  string sdp = 1;
  string type = 2; // "answer"
}

// WebRTC ICE Candidate
message ICECandidatePayload {
  string candidate = 1;
  string sdp_mid = 2;
  int32 sdp_m_line_index = 3;
}

// Recording control (start/stop)
message RecordingControlPayload {
  string host_user_id = 1;
  string podcast_id = 2;
  string recording_id = 3;
  int64 timestamp = 4;
}

// User joined podcast notification
message UserJoinedPayload {
  string user_id = 1;
  string username = 2;
  string client_id = 3;
}

// User left podcast notification
message UserLeftPayload {
  string user_id = 1;
  string client_id = 2;
}

// Error message
message ErrorPayload {
  string message = 1;
  string code = 2;
}

// Message type constants (for reference)
// connected, join-podcast, leave-podcast, podcast-joined
// user-joined, user-left, offer, answer, ice-candidate
// start-recording, stop-recording, recording-started, recording-stopped
// error

